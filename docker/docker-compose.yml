# docker-compose.yml — ComfyUI + MiniMax H3 (GPU) e o servidor MCP
#
# DOIS SERVICOS, DUAS IMAGENS
#
#   comfyui    minimax-comfyui:local  36,2 GB  render H3, GPU
#   mcp        minimax-python:local    ~5 GB   servidor MCP, GPU (Whisper)
#
# O `mcp` NAO usa o ComfyUI. Antes rodava na imagem dele (36,2 GB) so por
# conveniencia: o MCP fala com o ComfyUI por HTTP e transcreve com Whisper
# (transcribe_video, studio_pipeline). Carregava torch, CUDA e o ComfyUI
# inteiro para rodar um processo que nao precisa de nada disso.
#
# O custo nao era so disco. O servidor MCP rodava DENTRO do container do
# comfyui e herdava o ambiente de la -- foi assim que ficou sem
# RABBITMQ_URL enquanto tinha KB_DATABASE_URL, e as tools ig_* (ja migradas
# para o projeto insta_kb, ver docs/HANDOFF.md) falhavam com erro VAZIO
# enquanto as kb_* funcionavam (2026-08-12). O `postgres`, `rabbitmq` e
# `ig-worker` que existiam aqui foram embora com elas -- este compose agora
# só conhece o domínio de vídeo.
#
# ⚠️ SEPARAR CONTAINERS NAO SEPARA VRAM. Sao dois consumidores da mesma placa
# de 12 GB: ComfyUI (~11 GB em render) e MCP (Whisper). Mais o ig-worker do
# insta_kb, que continua disputando a MESMA GPU do host -- ver a regra do
# CLAUDE.md sobre pausar/retomar antes de um render.
#
# O `mcp` e o `comfyui` compartilham ${OUTPUT_DIR}: o MCP le os .mp4 que o
# ComfyUI escreve. E o unico acoplamento que nao se resolve com env var.

services:
  comfyui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        COMFYUI_TAG: ${COMFYUI_TAG:-v0.39.1}
    image: ${COMFY_IMAGE:-minimax-comfyui:local}
    container_name: ${COMFY_CONTAINER:-minimax-comfyui}
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      # host models dir (set MODELS_DIR in .env) -> container models dir (read-only)
      - ${MODELS_DIR:-/opt/minimax/models}:/comfy/ComfyUI/models:ro
      # host custom_nodes dir -> container custom_nodes (READ-WRITE, on purpose).
      # Without this mount custom_nodes lives inside the image, so every
      # `docker compose build` silently wipes every installed node. Writable
      # because several packs write next to themselves at runtime (Impact-Pack
      # config, KJNodes/Frame-Interpolation model downloads).
      # Seed the host dir from the image before mounting, or the two stock files
      # ComfyUI ships (websocket_image_save.py, example_node.py.example) vanish:
      #   docker cp minimax-comfyui:/comfy/ComfyUI/custom_nodes/. ${CUSTOM_NODES_DIR}/
      - ${CUSTOM_NODES_DIR:-/opt/minimax/custom_nodes}:/comfy/ComfyUI/custom_nodes
      # ComfyUI's user dir: everything the browser UI saves lives here --
      # workflows (user/default/workflows/*.json), settings, node presets.
      # Unmounted it sits inside the image, so every recreate throws away every
      # workflow the user ever saved, silently. Same trap as custom_nodes.
      - ${COMFY_USER_DIR:-/opt/minimax/comfy_user}:/comfy/ComfyUI/user
      # host output dir (gitignored) -> container output dir
      - ${OUTPUT_DIR:-${PROJECT_ROOT:-..}/output}:/comfy/ComfyUI/output
      # host input dir (optional; for I2V/R2V reference media)
      - ${INPUT_DIR:-${PROJECT_ROOT:-..}/input}:/comfy/ComfyUI/input
      # host downloads dir (studio downloads; writable) -> /downloads
      - ${DOWNLOADS_DIR:-${PROJECT_ROOT:-..}/downloads}:/downloads
      # persistent HuggingFace cache (faster-whisper models) so recreate doesn't re-download
      - ${HF_CACHE_DIR:-${PROJECT_ROOT:-..}/.hf-cache}:/root/.cache/huggingface
      # project source -> /workspace so `docker compose exec` can run the MCP server
      # using the in-image uv/venv without needing a host uv.
      # NOTE: use an ABSOLUTE host path (PROJECT_ROOT from .env) — relative paths
      # with --project-directory resolve one level too high.
      - ${PROJECT_ROOT:-..}:/workspace:ro
    extra_hosts:
      # Makes host.docker.internal resolve on Linux, where it does not by default.
      - "host.docker.internal:host-gateway"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # MCP server + ComfyUI client read these (also exported by config.sh)
      MODELS_DIR: /comfy/ComfyUI/models
      OUTPUT_DIR: /comfy/ComfyUI/output
      INPUT_DIR: /comfy/ComfyUI/input
      OUTPUT_PREFIX: ${OUTPUT_PREFIX:-video/factory}
      COMFYUI_URL: http://127.0.0.1:8188
      WORKFLOW_PATH: /workspace/workflows/minimax_h3_t2v_api.json
      # Host-side view of the output dir (MCP reports host paths to OpenCode)
      OUTPUT_HOST_DIR: ${OUTPUT_DIR:-${PROJECT_ROOT:-..}/output}
      # Studio downloads: container view (/downloads) + host-side view for reporting
      STUDIO_DOWNLOADS_DIR: /downloads
      STUDIO_DOWNLOADS_HOST_DIR: ${DOWNLOADS_DIR:-${PROJECT_ROOT:-..}/downloads}
      # Model set (bigger variants via .env)
      MODEL_DIFFUSION: ${MODEL_DIFFUSION:-minimax_h3_fl2va_pruned_int8_convrot.safetensors}
      MODEL_TEXT_ENCODER: ${MODEL_TEXT_ENCODER:-qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors}
      MODEL_VIDEO_VAE: ${MODEL_VIDEO_VAE:-minimax_h3_video_vae_fp16.safetensors}
      MODEL_AUDIO_VAE: ${MODEL_AUDIO_VAE:-minimax_h3_audio_vae_fp32.safetensors}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    # Extra CLI flags come from .env COMFYUI_EXTRA_ARGS (overridable on the CLI too).
    command: ["bash", "-c", "cd /comfy/ComfyUI && python main.py --listen 0.0.0.0 --port 8188 ${COMFYUI_EXTRA_ARGS:-}"]

  # Servidor MCP — container próprio, imagem Python enxuta, SEM ComfyUI.
  #
  # Antes ele rodava dentro do container do comfyui, por `docker exec`, e
  # herdava o ambiente de lá. Foi assim que ficou sem RABBITMQ_URL enquanto
  # tinha KB_DATABASE_URL, e as tools ig_* falhavam com erro vazio enquanto as
  # kb_* funcionavam (2026-08-12). Com serviço próprio, ele declara o que
  # precisa e o comfyui declara o que precisa.
  #
  # Ainda usa GPU: transcribe_video, studio_pipeline, knowledge_ingest_video e
  # knowledge_ingest_audio rodam faster-whisper com device=cuda. Separar
  # containers NÃO separa VRAM -- continuam três consumidores da mesma placa.
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    image: ${PYTHON_IMAGE:-minimax-python:local}
    container_name: ${MCP_CONTAINER:-minimax-mcp}
    depends_on:
      - comfyui
    ports:
      # MCP por HTTP (streamable-http). Sai do comfyui e vem para cá.
      - "127.0.0.1:${MCP_PORT:-8848}:${MCP_PORT:-8848}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace:ro
      # MESMO diretório de saída do comfyui: o MCP lê os .mp4 que ele escreve.
      # É o único acoplamento que não se resolve com variável de ambiente.
      - ${OUTPUT_DIR:-${PROJECT_ROOT:-..}/output}:/output
      # só para o health_check conferir se os pesos existem
      - ${MODELS_DIR:-/opt/minimax/models}:/models:ro
      - ${DOWNLOADS_DIR:-${PROJECT_ROOT:-..}/downloads}:/downloads
      - ${HF_CACHE_DIR:-${PROJECT_ROOT:-..}/.hf-cache}:/root/.cache/huggingface
      # Shared with insta_kb's ig-worker/api/mcp (same host path, neither
      # repo imports the other -- see src/minimax_mcp/gpu_lock.py).
      - ${HOME}/.gpu-lock:/var/lib/gpu-lock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      PYTHONPATH: /workspace/src
      # o ComfyUI agora é outro container: nome de serviço, não 127.0.0.1
      COMFYUI_URL: http://comfyui:8188
      WORKFLOW_PATH: /workspace/workflows/minimax_h3_t2v_api.json
      MODELS_DIR: /models
      OUTPUT_DIR: /output
      OUTPUT_HOST_DIR: ${OUTPUT_DIR:-${PROJECT_ROOT:-..}/output}
      OUTPUT_PREFIX: ${OUTPUT_PREFIX:-video/factory}
      STUDIO_DOWNLOADS_DIR: /downloads
      STUDIO_DOWNLOADS_HOST_DIR: ${DOWNLOADS_DIR:-${PROJECT_ROOT:-..}/downloads}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8848}
      GPU_LOCK_DIR: /var/lib/gpu-lock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    command: ["/opt/mcp-venv/bin/python", "-m", "minimax_mcp.server"]
