name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static checks (cloud runner, no GPU) — fast, catches syntax/structure bugs
  # ---------------------------------------------------------------------------
  static-lint:
    name: Static Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh tests/*.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done
          echo "✅ bash -n clean"

      - name: shellcheck (optional, soft-fail)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh tests/*.sh || true
            echo "✅ shellcheck done"
          else
            echo "⚠️  shellcheck not installed; skipping"
          fi

      - name: jq workflow JSON validate
        run: |
          jq -e . workflows/minimax_h3_t2v_api.json
          echo "✅ workflow JSON parses"

      - name: Python syntax compile
        run: |
          python3 -m py_compile src/minimax_mcp/server.py src/minimax_mcp/comfyui_client.py
          echo "✅ Python syntax OK"

  # ---------------------------------------------------------------------------
  # Pure-logic unit tests (cloud runner, no GPU) — duration math, path mapping,
  # inject_scene workflow patching
  # ---------------------------------------------------------------------------
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: uv sync (install deps)
        run: uv sync --frozen

      - name: Run unit_pure.py
        run: uv run python tests/unit_pure.py

  # ---------------------------------------------------------------------------
  # MCP handshake via host uv (cloud runner, no GPU, no container)
  # Verifies the FastMCP server starts and initialize handshake succeeds
  # ---------------------------------------------------------------------------
  mcp-handshake:
    name: MCP Handshake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: uv sync (install deps)
        run: uv sync --frozen

      - name: MCP stdio handshake (host uv, no container)
        run: |
          set -euo pipefail
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          RESP=$(printf '%s\n' "$INIT" | timeout 30 uv run --quiet python src/minimax_mcp/server.py 2>/dev/null | head -1) || RESP=""
          if echo "$RESP" | grep -q 'protocolVersion'; then
            echo "✅ MCP initialize handshake OK"
          else
            echo "❌ MCP handshake failed"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Full GPU validation (self-hosted runner with GPU + models) — runs the
  # complete diagnose.sh 00–07 suite including E2E render. Requires the
  # self-hosted runner to be registered with labels [self-hosted, linux, gpu].
  # ---------------------------------------------------------------------------
  gpu-validation:
    name: GPU Validation (self-hosted)
    needs: [static-lint, unit, mcp-handshake]
    # NEVER run a fork's code on the self-hosted runner. This repo is public and
    # the runner is a personal machine: a job here executes as the owning user,
    # with their SSH keys, cloud credentials and the docker socket -- which is
    # root on the host. `pull_request` checks out the FORK's tree, so without
    # this guard any accepted PR is arbitrary code execution on that machine.
    #
    # The repository's "require approval for all external contributors" setting
    # is defence in depth, not the defence: it moves the decision to a human
    # clicking Approve, and a hostile change can hide in .github/ or tests/
    # under an innocent-looking diff. This condition does not depend on anyone
    # reading carefully.
    #
    # Fork PRs still get static-lint, unit and mcp-handshake on GitHub's
    # throwaway runners, which is the feedback a contributor actually needs.
    #
    # always() is kept so this job still runs when an earlier job fails -- the
    # GPU suite is the slow one and its result is wanted either way.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    env:
      # The container's /workspace and /comfy/ComfyUI/output are bind-mounted from
      # the REAL project dir (see docker-compose.yml + .env PROJECT_ROOT/OUTPUT_DIR).
      # Host-side path resolution in tests 05/07 must therefore point at the same
      # host dirs, or the MCP's host<->container path mapping produces paths the
      # host tests cannot find.
      # PROJECT_ROOT, OUTPUT_DIR and OUTPUT_HOST_DIR are NOT set here. They are
      # resolved at runtime from the container's bind mount, in the "Resolve
      # host output dir" step below -- see the comment there for why.
      MODELS_DIR: /var/tmp/minimax/models
      COMFYUI_URL: http://127.0.0.1:8188
      # The runner's GPU is somebody's desk machine. The render tests wait for
      # the queue to drain rather than pushing a person's job behind CI's, and
      # skip if it never does -- an occupied GPU is not a broken pipeline.
      # 15 minutes is roughly one 1024x576 clip, so a run started mid-render
      # usually still gets to test.
      CI_QUEUE_WAIT_SECONDS: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize line endings (LF) + fix permissions
        run: |
          find scripts tests -name "*.sh" -exec sed -i 's/\r$//' {} +
          find .github/workflows -name "*.yml" -exec sed -i 's/\r$//' {} +
          chmod +x scripts/*.sh tests/*.sh

      - name: Ensure ComfyUI stack is up
        run: |
          set -euo pipefail
          if ! docker ps --format '{{.Names}}' 2>/dev/null | grep -q '^minimax-comfyui$'; then
            echo "Stack not running; starting..."
            ./scripts/start_comfyui.sh
          else
            echo "Stack already running"
          fi

      # Ask docker where it actually binds the output directory instead of
      # naming it here. Tests 05/07 resolve rendered files on the HOST, and the
      # container writes to whatever the compose file bound at start time --
      # which is the project directory, not the runner's checkout. Guessing
      # github.workspace made 05 look in an empty directory and report "no .mp4
      # in history outputs" while the clip sat happily in the real one.
      #
      # Deriving it has two properties a hardcoded path or a repo variable do
      # not: it cannot drift from what docker is really doing, and it keeps
      # this public file free of anyone's home directory.
      - name: Resolve host output dir from the container's bind mount
        run: |
          set -euo pipefail
          out=$(docker inspect minimax-comfyui \
            --format '{{range .Mounts}}{{if eq .Destination "/comfy/ComfyUI/output"}}{{.Source}}{{end}}{{end}}')
          if [ -z "$out" ]; then
            echo "::error::minimax-comfyui has no bind mount on /comfy/ComfyUI/output"
            exit 1
          fi
          # Written to GITHUB_ENV, not echoed: the path contains a home directory.
          {
            echo "OUTPUT_DIR=$out"
            echo "OUTPUT_HOST_DIR=$out"
            echo "PROJECT_ROOT=$(dirname "$out")"
          } >> "$GITHUB_ENV"
          echo "✅ resolved output dir from the container bind mount"

      - name: Run full diagnose.sh (00–07)
        run: |
          set -euo pipefail
          ./scripts/diagnose.sh