name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & Push to Docker Hub
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    env:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        if: env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push (publish_image.sh)
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail
          # publish_image.sh reads DOCKER_HUB_USER/REPO from .env or env
          export DOCKER_HUB_USER="${DOCKER_HUB_USER:-leodg}"
          export DOCKER_HUB_REPO="${DOCKER_HUB_REPO:-minimax-video-factory}"
          ./scripts/publish_image.sh