[project]
name = "minimax-video-factory"
version = "0.1.0"
description = "OpenCode + MCP + ComfyUI orchestration for local MiniMax H3 video+audio generation + Instagram/YT downloader + Whisper transcriber"
# >=3.11 (was >=3.10): av==18.1.0 requires Python >=3.11, so uv could not
# resolve for 3.10. Python 3.10 is EOL (Oct 2025); real runtimes here are
# 3.14 (host) and 3.11 (docker MCP venv) -- both still satisfied.
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=4.0.11",
    "pydantic>=2.11.4",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.2",
    "websockets>=13.0",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    # Same trap as insta_kb: faster-whisper 1.2.1's decode_audio() needs
    # av<19 (the metadata_errors kwarg was removed in 19.0.0; 19.x raises
    # TypeError on every transcription). Verified 2026-10-07 on Python 3.14:
    # 15.1.0/17.1.0/18.0.0/18.1.0 pass, 19.0.0/19.0.1 fail. This project
    # never declared `av` before (the lock drifted 17.1.0/18.0.0 via
    # markers) -- pin it. See docs/HANDOFF.md.
    "av==18.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pylint>=4.0.7",
]

# Docs-only group, installable WITHOUT the project and its runtime deps:
#   uv sync --only-group docs
# mkdocstrings reads the source statically (griffe), so building the API
# reference needs no torch, no faster-whisper and no database -- which keeps
# the Pages workflow at a handful of small wheels instead of ~2 GB.
[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
minimax-factory = "minimax_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests, no external services (fast, run always)",
    "integration_db: needs the comfyui container up (docker compose up -d comfyui); self-skips (rc=78) otherwise",
]

[tool.ruff.lint]
# BLE001: MCP tools are fail-soft by design — a backend error returns
#   {"ok": False} instead of raising, so a single broken tool never kills
#   the whole stdio/HTTP session. Broad `except Exception` is deliberate.
# B008: pydantic `Field(...)` in argument defaults is the idiomatic FastMCP
#   way to attach descriptions to tool parameters; not a mutable-default bug.
ignore = ["BLE001", "B008"]
