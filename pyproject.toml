[project]
name = "minimax-video-factory"
version = "0.1.0"
description = "OpenCode + MCP + ComfyUI orchestration for local MiniMax H3 video+audio generation + Instagram/YT downloader + Whisper transcriber"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "instagrapi>=2.1.0",
    "fastmcp>=3.0.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.2",
    "websockets>=13.0",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    # torch NAO entra aqui. Verificado em 2026-08-12:
    #   - nenhum `import torch` em src/, scripts/ ou tests/
    #   - `faster-whisper` depende de av, ctranslate2, huggingface-hub,
    #     onnxruntime, tokenizers e tqdm -- torch nao esta na lista
    #   - `ctranslate2` depende de numpy, pyyaml e setuptools
    #   - no uv.lock, o unico pacote que declarava torch era este projeto
    #   - `tests/unit_transcriber.py` chega a ASSERTAR que torch nao e importado
    # Custava 3,8 GB dos 5,2 GB do venv (torch 1,1 GB + 2,7 GB de libs nvidia),
    # e as libs que ele trazia eram cu13 -- versao errada: o ctranslate2 precisa
    # de libcublas.so.12, que o Dockerfile ja instala separado por causa disso.
    # O ComfyUI tem o torch DELE, da imagem base, e nao e afetado.
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.2",
    "pika>=1.3.2",
    "alembic>=1.13.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# Docs-only group, installable WITHOUT the project and its runtime deps:
#   uv sync --only-group docs
# mkdocstrings reads the source statically (griffe), so building the API
# reference needs no torch, no faster-whisper and no database -- which keeps
# the Pages workflow at a handful of small wheels instead of ~2 GB.
[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
minimax-factory = "minimax_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests, no external services (fast, run always)",
    "integration_db: requires Postgres up + migrated (docker compose up -d postgres && alembic upgrade head)",
    "integration_llm: requires a local Ollama daemon with LLM_MODEL/EMBEDDING_MODEL pulled",
]

[tool.ruff.lint]
# BLE001: MCP tools are fail-soft by design — a backend error returns
#   {"ok": False} instead of raising, so a single broken tool never kills
#   the whole stdio/HTTP session. Broad `except Exception` is deliberate.
# B008: pydantic `Field(...)` in argument defaults is the idiomatic FastMCP
#   way to attach descriptions to tool parameters; not a mutable-default bug.
ignore = ["BLE001", "B008"]
