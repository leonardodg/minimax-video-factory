[project]
name = "minimax-video-factory"
version = "0.1.0"
description = "OpenCode + MCP + ComfyUI orchestration for local MiniMax H3 video+audio generation + Instagram/YT downloader + Whisper transcriber"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.0.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.2",
    "websockets>=13.0",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
minimax-factory = "minimax_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]